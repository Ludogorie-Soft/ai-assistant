# Local development profile for running from IntelliJ
# Use this profile when running the application locally (not in Docker)
# Activate with: --spring.profiles.active=local

# Database connection for local development (connecting to Docker container on localhost)
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_database
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Other properties inherit from application.properties
# Environment variables for API keys still need to be set in IntelliJ run configuration
