spring.application.name=broker-bot

bot.authorization.token=${AUTHORIZATION_TOKEN}
eleven.labs.encrypted.key=${ELEVEN_LABS_ENCRYPTED_KEY}

twilio.encrypted.key=${TWILIO_ENCRYPTED_KEY}

elevenlabs.agent.id=${ELEVENLABS_AGENT_ID}
elevenlabs.agent.phone.id=${ELEVENLABS_AGENT_PHONE_ID}

spring.datasource.url=${DB_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
